<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5 — Image + Text Demonstration</title>
</head>
<body>

    <h1>IMAGES</h1>

    <article>

        <section>
            <figure>
                <img src="images/scenery1.jpg" alt="Một góc phong cảnh cây lá thu vàng bên bờ sông với những dãy núi phía xa">
                <figcaption>Hình 1: Phong cảnh cây lá thu bên bờ sông.</figcaption>
            </figure>
            <p>A paragraph with an image. The align attribute of the image is set to "left". The image will float to the left of this text.</p>
        </section>

        <hr>

        <section>
            <figure>
                <img src="images/scenery2.jpg" alt="Một cánh đồng hoa màu tím trải dài trên sườn đồi dưới nắng mặt trời">
                <figcaption>Hình 2: Sườn đồi hoa tím dưới nắng.</figcaption>
            </figure>
            <p>A paragraph with an image. The align attribute of the image is set to "right". The image will float to the right of this text.</p>
        </section>

    </article>

</body>
</html>
